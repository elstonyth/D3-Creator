# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  # ONE npm entry at the workspace root, on purpose. Dependabot understands the
  # pnpm workspace: a root-directory bump already edits apps/frontend,
  # apps/analyzer and libraries/* manifests together with the single lockfile
  # (#99, #100, #109, #111 all did). A second entry for /apps/frontend opened a
  # twin PR that changed that manifest WITHOUT regenerating the shared lockfile,
  # and every one of them (#93, #94, #95, #105, #106, #113) failed
  # `pnpm install` with ERR_PNPM_OUTDATED_LOCKFILE. Do not add it back.
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 5
    commit-message:
      prefix: 'chore(deps)'
      prefix-development: 'chore(deps-dev)'
    ignore:
      # TypeScript majors are toolchain migrations (Next, ts-jest and
      # typescript-eslint each pin a range), never a routine bump: the 7.0 PR
      # (#94) failed on every build. Take them by hand.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # @types/node tracks the runtime major (engines: node >=22 <25). A
      # higher major (#105 went to 26) types APIs the deployment does not have.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  # Keep the GitHub Actions in .github/workflows current too.
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 3
    commit-message:
      prefix: 'ci(deps)'
